:root {
  --ink: #4A3341; --paper: #FFF7EA; --cream: #FFF1DC; --apricot: #F6A97E; --apricot-deep: #C9653E;
  --mint: #94D4BB; --mint-deep: #2F7F63; --violet: #9C89D4; --violet-deep: #6650A6; --bar: rgba(255, 249, 238, 0.92);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #FFF9EF; color: var(--ink); overflow: hidden;
  font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; background: #FFF9EF; }
#stage { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s; }
.scene.active { opacity: 1; visibility: visible; transition: opacity .9s ease, visibility 0s; }
.world-svg { width: 100%; height: 100%; display: block; }
.clock-num { font: 700 17px 'Readex Pro', sans-serif; fill: var(--ink); }
.lens-word { font: 700 24px 'Readex Pro', sans-serif; fill: #A38E9A; }
.lens-word.on { fill: var(--ink); }
.sign-text { font: 600 25px 'Readex Pro', sans-serif; fill: var(--ink); }
.card-word { font: 700 64px 'Readex Pro', sans-serif; fill: var(--ink); }
.card-small { font: 600 22px 'Readex Pro', sans-serif; fill: #7B6070; }
.bubble-text { font: 700 34px 'Readex Pro', sans-serif; fill: var(--ink); direction: rtl; }
#grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .07; background-size: 220px 220px; }

/* not-yet-built screens (sample only) */
.scene.pending { display: grid; place-items: center; background: var(--paper); }
.pending-card { text-align: center; padding: 2.4rem 3rem; border: 3px dashed #D9C3A6; border-radius: 28px; max-width: min(90vw, 640px); }
.pending-card h2 { margin: .4rem 0 .6rem; font-size: clamp(1.6rem, 3.4vw, 2.6rem); }
.pending-card p { margin: 0; color: #7B6070; font-size: clamp(1rem, 1.6vw, 1.25rem); line-height: 1.8; }
.pending-no { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; background: var(--mint); font-weight: 700; font-size: 1.4rem; }

/* start gate */
#gate { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 246, 232, .35); z-index: 20; transition: opacity .5s ease, visibility 0s linear .5s; }
#gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate-card { text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 34px; padding: clamp(1.4rem, 4vw, 2.6rem) clamp(1.6rem, 6vw, 4rem);
  box-shadow: 0 10px 0 rgba(74, 51, 65, .12); max-width: 92vw; }
.gate-kicker { margin: 0; color: var(--apricot-deep); font-weight: 600; font-size: clamp(.95rem, 1.6vw, 1.15rem); }
#gate-title { margin: .3rem 0 1.2rem; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.25; }
#gate-btn { font: 700 clamp(1.2rem, 2.4vw, 1.6rem) 'Readex Pro', sans-serif; color: var(--paper); background: var(--violet-deep); border: 3px solid var(--ink);
  border-radius: 999px; padding: .55em 1.8em; cursor: pointer; box-shadow: 0 5px 0 var(--ink); }
#gate-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
#gate-btn:focus-visible { outline: 4px solid var(--apricot); outline-offset: 4px; }
.gate-hint { margin: 1.1rem 0 0; font-size: clamp(.85rem, 1.4vw, 1rem); color: #7B6070; }

/* «صندوق العجائب»: operator bar = three icons only (no text on screen) */
.controls button { width: 52px; height: 52px; padding: 0 !important; justify-content: center; }
.controls button.primary { background: #6B4FA8; color: #FFF7EA; }
.controls button.primary:hover { background: #7D62BC; }
#toast { display: flex; align-items: center; gap: 10px; }
#toast svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#toast kbd { font: 700 15px 'Readex Pro', sans-serif; border: 1.5px solid rgba(255, 247, 234, .5); border-radius: 6px; padding: 2px 8px; }
body:not(.running) .controls { opacity: 1 !important; pointer-events: auto !important; }

/* controls: one compact bar, fades out while the story plays */
.controls { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bar); border: 2px solid rgba(74, 51, 65, .35); border-radius: 999px;
  box-shadow: 0 4px 14px rgba(74, 51, 65, .12); transition: opacity .4s ease; direction: rtl; }
body:not(.running) .controls { opacity: 0; pointer-events: none; }
body.idle .controls { opacity: 0; }
body.idle { cursor: none; }
.controls button { font: 600 15px 'Readex Pro', sans-serif; color: var(--ink); background: transparent; border: 0; border-radius: 999px;
  min-height: 40px; min-width: 40px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.controls button:hover { background: rgba(156, 137, 212, .18); }
.controls button:focus-visible { outline: 3px solid var(--violet-deep); outline-offset: 1px; }
.controls button:disabled { opacity: .35; cursor: default; background: transparent; }
.controls svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#counter { font-weight: 700; font-size: 17px; min-width: 3.6em; text-align: center; direction: rtl; font-variant-numeric: tabular-nums; }
.sep { width: 2px; height: 24px; background: rgba(74, 51, 65, .2); margin: 0 2px; }
#mute .x { display: none; } #mute.on .x { display: inline; } #mute.on .wave { display: none; }
#fs .exit { display: none; } #fs.on .exit { display: inline; } #fs.on .enter { display: none; }
#vol { width: 92px; accent-color: var(--violet-deep); }
#toast { position: absolute; top: 18px; left: 50%; transform: translate(-50%, -20px); background: var(--ink); color: var(--paper); padding: .6em 1.2em; border-radius: 14px;
  font-size: 16px; opacity: 0; transition: opacity .3s, transform .3s; z-index: 30; pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 640px) {
  .controls button span { display: none; }
  #vol { width: 64px; }
  .controls { gap: 2px; padding: 4px 6px; }
}
body.still .controls { display: none; }

/* projector mode (P): stronger contrast and colour so pastels survive a washed-out projector */
#app.proj #stage { filter: contrast(1.16) saturate(1.32) brightness(.98); }
#ptoast { position: absolute; top: 18px; right: 18px; width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: var(--ink); color: var(--paper);
  opacity: 0; transition: opacity .3s; z-index: 30; pointer-events: none; }
#ptoast.on { opacity: 1; } #ptoast svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
#ptoast.lit svg { fill: #FFD15A; stroke: #FFD15A; }

/* storybook wipe between screens: a cream cloud band sweeps across (right → left) */
#wipe { position: absolute; top: 0; bottom: 0; left: 0; width: 210vw; z-index: 15; pointer-events: none; transform: translateX(110vw); visibility: hidden; }
#wipe svg { width: 100%; height: 100%; display: block; }
#wipe .w2 { fill: #D9CCF2; } #wipe .w1 { fill: #FFF6E8; }
#wipe.run { visibility: visible; animation: wipe 1.5s cubic-bezier(.55, .05, .45, .95) forwards; }
/* speed indicator (− / +): six bars, more filled = faster */
#stoast { position: absolute; top: 18px; right: 84px; height: 54px; padding: 0 14px; display: flex; align-items: flex-end; gap: 5px; padding-bottom: 12px; border-radius: 16px;
  background: var(--ink); opacity: 0; transition: opacity .3s; z-index: 30; pointer-events: none; }
#stoast.on { opacity: 1; }
#stoast i { width: 7px; border-radius: 3px; background: rgba(255, 247, 234, .25); }
#stoast i:nth-child(1) { height: 8px; } #stoast i:nth-child(2) { height: 13px; } #stoast i:nth-child(3) { height: 18px; } #stoast i:nth-child(4) { height: 23px; } #stoast i:nth-child(5) { height: 27px; } #stoast i:nth-child(6) { height: 31px; }
#stoast i.on { background: #FFD15A; }
@keyframes wipe { from { transform: translateX(105vw); } to { transform: translateX(-215vw); } }
.rm #wipe { display: none; }
.rm .scene, .rm .scene.active, .rm #gate { transition-duration: .2s; }

</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-live="off"></main>
  <div id="grain" aria-hidden="true"></div>
  <nav class="controls" aria-label="لوحة المشغّل">
    <button id="prev" type="button" aria-label="السابق" title="السابق (→ أو Page Up)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span id="counter" aria-hidden="true">١ / ٧</span>
    <button id="next" type="button" class="primary" aria-label="التالي" title="التالي (← أو Page Down)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="mute" type="button" aria-label="كتم الصوت" title="الصوت (M)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>

  // ---------------- an upside-down house ----------------
  // o: { x: centre, w: wall width, h: wall height, rh: roof height, wall, roof, door, rows, ladder }
  function house(parent, o) {
    const H = g(parent, { class: 'house' });
    const base = 640, yb = base - o.rh, yt = yb - o.h, L = o.x - o.w / 2, R = o.x + o.w / 2;
    const rock = g(H);
    groundShadow(rock, o.x, base + 2, 44, 7, 0.35);
    // small stone the roof tip balances on
    part(rock, `M${o.x - 22},${base + 2} C${o.x - 22},${base - 12} ${o.x + 22},${base - 12} ${o.x + 22},${base + 2}Z`, PAL.stone, { line: 2.4 });
    // inverted roof
    const eL = L - 18, eR = R + 18;
    const roofD = `M${eL},${yb} L${eR},${yb} Q${eR + 3},${yb + 9} ${eR - 7},${yb + 15} L${o.x + 14},${base - 10} Q${o.x},${base - 1} ${o.x - 14},${base - 10} L${eL + 7},${yb + 15} Q${eL - 3},${yb + 9} ${eL},${yb}Z`;
    const tiles = (inner) => {
      for (let y = yb + 18, row = 0; y < base - 18; y += 15, row++) {
        const u = (y - yb) / o.rh, hw = (o.w / 2 + 18) * (1 - u) + 10 * u, n = Math.max(2, Math.round(hw * 2 / 26));
        let d = `M${f(o.x - hw)},${y}`;
        for (let k = 0; k < n; k++) { const x1 = o.x - hw + (k + 1) * hw * 2 / n; d += ` Q${f(x1 - hw / n)},${y + 9} ${f(x1)},${y}`; }
        line(inner, d, o.roof.line, 1.8, { opacity: 0.45 });
      }
    };
    part(H, roofD, o.roof, { line: 3.2, pattern: tiles, shade: [`M${o.x},${yb} L${eR + 4},${yb} L${eR},${yb + 16} L${o.x + 14},${base - 8} L${o.x},${base}Z`], light: [`M${eL + 8},${yb + 3} L${o.x - 30},${yb + 3} L${o.x - 40},${yb + 12} L${eL + 12},${yb + 12}Z`], shadeOpacity: 0.85 });
    // walls
    const walls = (inner) => { for (let y = yt + 26; y < yb - 6; y += 22) line(inner, `M${L},${y} H${R}`, o.wall.line, 1.4, { opacity: 0.12 }); };
    part(H, rr(L, yt, o.w, o.h, 12), o.wall, { line: 3.4, pattern: walls, shade: [`M${R - 26},${yt} H${R + 4} V${yb + 4} H${R - 18} C${R - 22},${yb - 40} ${R - 24},${yt + 60} ${R - 26},${yt}Z`, `M${L},${yb - 22} H${R} V${yb + 2} H${L}Z`], light: [`M${L + 8},${yt + 10} H${L + 18} V${yt + o.h * 0.6} C${L + 14},${yt + o.h * 0.4} ${L + 10},${yt + 30} ${L + 8},${yt + 10}Z`] });
    // corner trims
    for (const x of [L + 4, R - 14]) part(H, rr(x, yt + 6, 10, o.h - 12, 4), PAL.trim, { line: 1.8, weight: false });
    // windows: arches at the BOTTOM, curtains billowing UP, flower boxes ABOVE with flowers hanging down
    const winW = o.winW || 52, winH = winW * 1.35;
    const cols = o.cols || 2, rows = o.rows || 1;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const wx = L + (o.w / (cols + 1)) * (k + 1) - winW / 2, wy = yt + o.h * (rows === 1 ? 0.44 : 0.3 + r * 0.36);
      window_(H, wx, wy, winW, winH, o);
    }
    // the door, at the TOP of the house
    const dw = o.dw || 58, dh = dw * 1.55, dx = o.x - dw / 2, dy = yt + 8;
    const doorD = `M${dx},${dy} H${dx + dw} V${dy + dh - dw / 2} A${dw / 2},${dw / 2} 0 0 1 ${dx},${dy + dh - dw / 2}Z`;
    part(H, `M${dx - 7},${dy - 4} H${dx + dw + 7} V${dy + dh - dw / 2} A${dw / 2 + 7},${dw / 2 + 7} 0 0 1 ${dx - 7},${dy + dh - dw / 2}Z`, PAL.trim, { line: 2.6 });
    part(H, doorD, tone('#5A3A4E', { line: '#3A2133' }), { line: 2.4, weight: false });
    el('ellipse', { cx: o.x, cy: dy + dh * 0.45, rx: dw * 0.36, ry: dh * 0.32, fill: radial(H, [[0, '#FFE9A6', 0.95], [1, '#FFC86B', 0]]) }, H);
    const leaf = g(H);
    part(leaf, doorD, o.door, { line: 2.6, shade: [`M${dx + dw * 0.65},${dy} H${dx + dw} V${dy + dh - dw / 2} A${dw / 2},${dw / 2} 0 0 1 ${dx + dw * 0.65},${dy + dh - 4}Z`] });
    part(leaf, rr(dx + 9, dy + 12, dw - 18, dh * 0.34, 5), o.door, { line: 1.8, weight: false, shade: [] });
    part(leaf, `M${dx + dw - 15},${dy + dh * 0.55} a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0Z`, PAL.lemon, { line: 1.6, weight: false });
    // doorstep above the door (it's upside down too)
    part(H, rr(dx - 18, yt - 14, dw + 36, 16, 6), PAL.stone, { line: 2.6, shade: [rr(dx - 18, yt - 6, dw + 36, 8, 4)] });
    // ladder up to the door

    }
    return { g: H, leaf, hinge: dx, top: yt, rock, lad, cy: (yt - 14 + 640) / 2 };
  }
  function window_(H, x, y, w, h, o) {

      el('circle', { cx: fx, cy: y - 6 + len, r: 2.6, fill: '#FFE18A' }, H);
    }

  // ---------------- clock tower ----------------
  function tower(parent, x) {

    // clock
    const cy = top + 104, R = 62;

    part(ck, `M0,${-R - 12} C${R + 6},${-R - 12} ${R + 12},${-R + 6} ${R + 12},0 C${R + 12},${R - 6} ${R - 6},${R + 12} 0,${R + 12} C${-R + 6},${R + 12} ${-R - 12},${R - 6} ${-R - 12},0 C${-R - 12},${-R + 6} ${-R + 6},${-R - 12} 0,${-R - 12}Z`, PAL.lilac, { line: 3.2, shade: [`M${R * 0.4},${-R} C${R + 16},${-R * 0.4} ${R + 10},${R * 0.8} 0,${R + 12} C${R},${R * 0.6} ${R + 4},${-R * 0.3} ${R * 0.4},${-R}Z`] });
    part(ck, `M0,${-R} C${R * 0.56},${-R} ${R},${-R * 0.56} ${R},0 C${R},${R * 0.56} ${R * 0.56},${R} 0,${R} C${-R * 0.56},${R} ${-R},${R * 0.56} ${-R},0 C${-R},${-R * 0.56} ${-R * 0.56},${-R} 0,${-R}Z`, PAL.trim,
      { line: 2.6, light: [`M${-R * 0.8},${-R * 0.3} C${-R * 0.7},${-R * 0.75} ${-R * 0.3},${-R * 0.95} 0,${-R * 0.95} C${-R * 0.35},${-R * 0.8} ${-R * 0.6},${-R * 0.55} ${-R * 0.75},${-R * 0.2}Z`] });
    for (let i = 0; i < 12; i++) {

    part(ck, 'M-7,0 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0Z', PAL.lemon, { line: 1.8, weight: false });

    return { g: T, hour, minute, vane, vaneC: [x, top - 162], clock: [x, cy] };
  }

  // ------------------------------------------------ the tree grows (g: 0 sprout … 1 full tree with fruit and shade)
  function tree(parent, x, base) {

    part(garden, `M${x - 310},${base + 6} C${x - 300},${base - 36} ${x + 300},${base - 36} ${x + 310},${base + 6} C${x + 300},${base + 48} ${x - 300},${base + 48} ${x - 310},${base + 6}Z`, lawnT,

    for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, gx = x + Math.cos(a) * 286, gy = base + 6 + Math.sin(a) * 34; line(garden, `M${f(gx - 6)},${f(gy)} l3,-10 M${f(gx)},${f(gy)} l0,-13 M${f(gx + 6)},${f(gy)} l-3,-10`, '#4F8A47', 2); }

      line(b, 'M0,-6 V6', '#3A2133', 2.2); return [b, wings]; });
    const shade = el('ellipse', { cx: x, cy: base + 10, rx: 10, ry: 4, fill: '#3E5A2E', opacity: 0 }, grp);
    const sprout = g(grp);
    part(sprout, `M${x - 3},${base} C${x - 3},${base - 20} ${x - 2},${base - 30} ${x},${base - 40} L${x + 4},${base - 40} C${x + 4},${base - 30} ${x + 4},${base - 20} ${x + 4},${base}Z`, tone('#7CC873', { line: '#33703A' }), { line: 1.8, weight: false });

      { line: 3, shade: [`M${x + 6},${base - 290} C${x + 16},${base - 200} ${x + 12},${base - 100} ${x + 22},${base - 40} C${x + 26},${base - 14} ${x + 34},${base} ${x + 48},${base + 4} L${x + 6},${base + 8}Z`],
        light: [`M${x - 12},${base - 270} C${x - 16},${base - 200} ${x - 12},${base - 120} ${x - 14},${base - 60} L${x - 8},${base - 60} C${x - 6},${base - 120} ${x - 10},${base - 200} ${x - 6},${base - 270}Z`],
        pattern: (inner) => { for (const k of [60, 120, 180, 240]) line(inner, `M${x - 4},${base - k} c5,-8 2,-16 7,-24`, trunkT.line, 1.6, { opacity: 0.45 }); el('ellipse', { cx: x + 4, cy: base - 160, rx: 5, ry: 8, fill: trunkT.shade, stroke: trunkT.line, 'stroke-width': 1.4 }, inner); } });
    // canopy: a dark back mass, then leaf clusters, each with its own shade and light
    part(big, lobes(x, base - 352, 228, 168, 14, 0.26), darkT, { line: 3 });
    for (const [dx, dy, rx, ry] of [[-150, -392, 72, 58], [150, -396, 74, 58], [-56, -432, 112, 80], [70, -422, 106, 78], [-128, -306, 106, 82], [128, -316, 108, 84], [0, -332, 122, 88]])

    for (let i = 0; i < 30; i++) { const r1 = ((i * 7919) % 211) / 211, r2 = ((i * 4421) % 173) / 173, a = r1 * Math.PI * 2, rad = 0.25 + 0.65 * r2; line(big, `M${f(x + Math.cos(a) * 190 * rad - 5)},${f(base - 360 + Math.sin(a) * 130 * rad)} q5,-6 10,0`, '#33703A', 2, { opacity: 0.5 }); }

      part(fruit, `M${x + dx - 11},${base + dy} a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0Z`, tone('#F6A34E', { line: '#A0501C', shade: '#E07E2E', light: '#FFC98A' }), { line: 1.8, weight: false, light: [`M${x + dx - 6},${base + dy - 5} a3,3 0 1,0 6,0Z`] });

      flies.forEach(([b, wings], i) => { const on = Math.max(0, Math.min(1, (gv - 0.92) * 12)); b.setAttribute('opacity', on.toFixed(2)); const u = t * 0.35 + i * 3;
        b.setAttribute('transform', `translate(${f(x + (i ? 1 : -1) * (150 + Math.sin(u) * 90))},${f(base - 70 + Math.sin(u * 2.3) * 26)})`); wings.setAttribute('transform', `scale(${f(0.35 + 0.65 * Math.abs(Math.sin(t * 9 + i)))},1)`); });
      const sp = Math.min(1, gv * 4);

      sprout.setAttribute('transform', `translate(${x},${base}) scale(${f(0.2 + 0.8 * sp)},${f(0.2 + 0.8 * sp)}) translate(${-x},${-base})`);
      heartLeaf.setAttribute('opacity', Math.max(0, gv * 6 - 0.6).toFixed(2));
      const bg = Math.max(0, (gv - 0.3) / 0.7), s = 0.1 + 0.9 * bg;          // grows solid from small (never a see-through "ghost" tree)
      big.setAttribute('opacity', Math.min(1, bg * 14).toFixed(3));

  // ------------------------------------------------ the glowing seed, and a watering can with drops
  function seed(parent) {

    part(grp, 'M0,-16 c4,-8 12,-10 16,-6 c-4,6 -10,8 -16,6Z', leafT, { line: 1.6, weight: false });
    return { set(x, y, amt, t, s) { grp.setAttribute('opacity', Math.min(1, amt).toFixed(3)); grp.setAttribute('transform', `translate(${f(x)},${f(y + Math.sin(t * 2) * 4)}) scale(${f(s || 1)})`); } };
  }
  function wateringCan(parent, col) {

    part(grp, 'M-22,-14 L18,-14 L20,16 C10,22 -10,22 -20,16Z', T1, { line: 2.2, light: ['M-16,-10 L-12,-10 L-13,12 L-16,12Z'] });

    line(grp, 'M-14,-14 C-14,-34 10,-34 10,-14', T1.line, 4.6); line(grp, 'M-14,-14 C-14,-34 10,-34 10,-14', T1.base, 2.6);
    const drops = g(grp); for (let i = 0; i < 5; i++) el('path', { d: 'M0,-4 C3,0 3,4 0,5 C-3,4 -3,0 0,-4Z', fill: '#8FD3F0', stroke: '#3E8CB8', 'stroke-width': 0.8 }, drops);
    return { set(x, y, amt, t, pour, flip) {
      grp.setAttribute('opacity', Math.min(1, amt).toFixed(3));
      grp.setAttribute('transform', `translate(${f(x)},${f(y)}) scale(${flip ? -1 : 1},1) rotate(${f(pour * 28)})`);
      [...drops.children].forEach((d, i) => { const u = ((t * 1.6 + i / 5) % 1); d.setAttribute('transform', `translate(${f(50 + u * 10)},${f(-16 + u * 70)})`); d.setAttribute('opacity', (pour * (1 - u)).toFixed(2)); });
    } };
  }

  // ------------------------------------------------ tiny promise icons shown above each symbol in the last choice
  function promiseIcon(parent, kind) {
    const grp = g(parent, { opacity: 0 });
    el('circle', { cx: 0, cy: 0, r: 34, fill: '#FFFDF8', stroke: '#A08CA8', 'stroke-width': 2.4 }, grp);

      part(grp, 'M-16,6 C-16,-6 -6,-10 4,-8 C10,-6 14,0 20,2 C22,6 20,10 16,10 L-14,10 C-16,10 -16,8 -16,6Z', tone('#F5BC3E', { line: '#A86E14' }), { line: 1.8 });

      part(grp, 'M-2,18 L-2,0 L4,0 L4,18Z', trunkT, { line: 1.4, weight: false }); part(grp, lobes(1, -8, 18, 14, 7, 0.3), leafT, { line: 1.6 });
    } else {   // a floating island
      part(grp, 'M-20,0 C-12,-4 12,-4 20,0 C12,8 6,16 0,22 C-6,16 -12,8 -20,0Z', tone('#B38A68', { line: '#5E3E26' }), { line: 1.6 });
      part(grp, 'M-21,0 C-12,-6 12,-6 21,0 C12,3 -12,3 -21,0Z', leafT, { line: 1.4, weight: false }); part(grp, lobes(-4, -12, 8, 7, 6, 0.3), leafT, { line: 1.2, weight: false });
    }
    return { set(x, y, amt) { grp.setAttribute('opacity', Math.min(1, amt).toFixed(3)); grp.setAttribute('transform', `translate(${f(x)},${f(y)}) scale(${f(0.6 + 0.4 * Math.min(1, amt))})`); } };
  }

  // ------------------------------------------------ three light dots that fill one per knock (the children count with them — no numbers)
  function knockDots(parent) {
    const grp = g(parent, { opacity: 0 });
    const dots = [-1, 0, 1].map((i) => { const x = i * 46, d = g(grp);
      const glow = el('circle', { cx: x, cy: 0, r: 30, fill: radial(d, [[0, '#FFF2B8', 1], [1, '#FFD15A', 0]]), opacity: 0 }, d);
      el('circle', { cx: x, cy: 0, r: 14, fill: '#FFFDF4', stroke: '#C8922E', 'stroke-width': 3, opacity: 0.9 }, d);
      const core = part(d, P3.starD(x, 0, 13, 5.6), tone('#FFD15A', { line: '#A26A12', light: '#FFF2B0' }), { line: 1.6, weight: false }); core.setAttribute('opacity', 0);
      return { d, x, glow, core }; });
    return { set(x, y, amt, t, hits) {
      if (amt <= 0.001) { grp.setAttribute('opacity', 0); return; }
      grp.setAttribute('opacity', Math.min(1, amt).toFixed(2)); grp.setAttribute('transform', `translate(${f(x)},${f(y)})`);
      dots.forEach((D, i) => { const dt = t - hits[i], on = dt >= 0, s = on ? 1 + 0.6 * Math.sin(Math.min(1, dt / 0.35) * Math.PI) : 1;
        D.core.setAttribute('opacity', on ? 1 : 0); D.glow.setAttribute('opacity', on ? (0.55 + 0.45 * Math.max(0, 1 - dt / 0.9)).toFixed(2) : 0);
        D.d.setAttribute('transform', `translate(${D.x},0) scale(${f(s)}) translate(${-D.x},0)`); });
    } };
  }
  // ------------------------------------------------ the box answers each knock: a jolt, a little hop, the lid peeks and light escapes
  function knockFx(t, hits) {
    let rot = 0, dy = 0, peek = 0;
    for (const h of hits) { const d = t - h; if (d > 0 && d < 0.9) { const e = Math.exp(-d * 6); rot += Math.sin(d * 38) * 5 * e; dy -= Math.abs(Math.sin(d * 18)) * 12 * e; peek = Math.max(peek, 0.16 * Math.exp(-d * 5)); } }
    return { rot, dy, peek };
  }
  // ------------------------------------------------ anticipation before a reveal: a growing tremble, the lid rattling
  function shakeFx(t, a, b) {
    if (t < a || t > b) return { rot: 0, dy: 0, peek: 0 };
    const u = (t - a) / (b - a), amp = u * u;
    return { rot: Math.sin(t * 34) * 3.5 * amp, dy: -Math.abs(Math.sin(t * 22)) * 5 * amp, peek: 0.1 * amp * Math.abs(Math.sin(t * 9)) };
  }
  // ------------------------------------------------ a living figure transform: breathing, a gentle sway, and a hop with squash & stretch on surprise
  function alive(x, y, t, ph, bob, hops, amb) {
    let dy = 0, sy = 1;
    if (amb) for (const h of hops || []) { const u = (t - h) / 0.45; if (u > 0 && u < 1) { dy += Math.sin(Math.PI * u) * 18; sy += u < 0.18 ? -0.05 * (u / 0.18) : 0.045 * Math.sin(Math.PI * (u - 0.18) / 0.82); } }
    const sway = amb ? Math.sin(t * 0.8 + ph) * 0.7 : 0, br = 1 + 0.008 * Math.sin(t * 1.7 + ph);
    return `translate(${f(x)},${f(y - (bob || 0) - dy)}) rotate(${sway.toFixed(2)}) scale(${(2 - sy).toFixed(4)},${(sy * br).toFixed(4)})`;
  }

  window.Props3b = { floatSymbol, lightScroll, vision, tint, square, tree, seed, wateringCan, promiseIcon, knockDots, knockFx, shakeFx, alive };
})();

<script>
/* «صندوق العجائب» — full-screen imagination.

   holds while the narrator speaks, then shrinks back into the bubble. Same picture-book drawing system.
   dream(svg, kind) → { set({ open 0..1, ox, oy, r0, t, u, k, hide }) }

(function () {
  'use strict';

  const gold = tone('#FFCF4A', { shade: '#E8A72E', light: '#FFEFA0', line: '#9A6410' });

  const clamp = (v) => Math.max(0, Math.min(1, v)), ease = (v) => v * v * (3 - 2 * v);
  const pop = (u) => (u <= 0 ? 0 : u < 1 ? u * (1 + Math.sin(u * Math.PI) * 0.35) : 1);

  // ---------------------------------------------------------------- helpers
  const sky = (p, stops) => el('rect', { x: -500, y: -500, width: 2600, height: 1900, fill: linear(p, stops) }, p);
  function cloud(p, x, y, s, tn) { return part(p, lobes(x, y, 90 * s, 32 * s, 8, 0.42), tn || PAL.cloud, { line: 2.6, shade: [lobes(x + 14 * s, y + 14 * s, 74 * s, 16 * s, 7, 0.3)], light: [lobes(x - 30 * s, y - 12 * s, 30 * s, 10 * s, 6, 0.3)] }); }
  function twinkles(p, n, y0, y1, col) {
    const arr = [];

  }
  function fig(p, C, P, x, y) { const n = g(p, { transform: `translate(${x},${y})` }); Cst.figure(n, C, P); return n; }
  const place = (n, x, y, extra) => n.setAttribute('transform', `translate(${f(x)},${f(y)})${extra || ''}`);
  function canopyTree(p, x, base, s) {     // a full, detailed tree (used inside dreams)
    const tg = g(p, { transform: `translate(${x},${base}) scale(${s})` });
    el('ellipse', { cx: 0, cy: 6, rx: 150, ry: 20, fill: '#2E5A28', opacity: 0.25 }, tg);

    part(c, 'M650,650 L650,370 C650,250 950,250 950,370 L950,650Z', frameT, { line: 3.4, shade: ['M900,300 C940,330 950,350 950,370 L950,650 L920,650 L920,370 C920,340 912,316 900,300Z'] });
    el('path', { d: 'M676,650 L676,374 C676,282 924,282 924,374 L924,650Z', fill: radial(c, [[0, '#FFFFFF', 1], [0.6, '#FFF6CC', 1], [1, '#FFE08A', 1]]) }, c);

    part(leaf, 'M676,650 L676,374 C676,282 924,282 924,374 L924,650Z', leafT, { line: 3, shade: ['M870,300 C910,320 924,346 924,374 L924,650 L880,650Z'], pattern: (inner) => { el('path', { d: 'M706,630 L706,390 C706,320 894,320 894,390 L894,630Z', fill: 'none', stroke: '#FFE08A', 'stroke-width': 3, opacity: 0.7 }, inner); } });

    const motes = []; for (let i = 0; i < 18; i++) motes.push([el('path', { d: P3.sparkD(0, 0, 6 + (i % 3) * 3), fill: '#FFF6CC' }, c), i / 18]);

    el('path', { d: winD, fill: 'none', stroke: '#A08CA8', 'stroke-width': 3, 'vector-effect': 'non-scaling-stroke' }, rim);
    return {
      set(o) {
        const op = clamp(o.open);
        if (op <= 0.001) { if (root.style.display !== 'none') root.style.display = 'none'; if (o.hide) o.hide.style.visibility = ''; return 0; }
        root.style.display = '';

        const cx = o.ox + (800 - o.ox) * e, cy = o.oy + (450 - o.oy) * e;
        zoom.setAttribute('transform', `translate(${f(cx)},${f(cy)}) scale(${sc.toFixed(4)}) translate(-800,-450)`);
        rim.setAttribute('opacity', op >= 0.999 ? 0 : 1);
        upd(o.t, o.k || 0, o.u || 0);
        if (o.hide) o.hide.style.visibility = op >= 0.999 ? 'hidden' : '';     // the room is not drawn while the dream fills the screen
        return op;
      },
    };
  }
  // open 0→1 over `inD` from a, back to 0 over `outD` from b (reduced motion: a plain switch)
  function openAt(t, a, b, inD, outD, rm) {
    if (rm) return t >= a && t < b ? 1 : 0;
    return Math.min(clamp((t - a) / (inD || 1.1)), 1 - clamp((t - b) / (outD || 0.9)));
  }
  window.Dreams3 = { dream, openAt };
})();

<script>
/* «صندوق العجائب» — soft sound effects, synthesised live (no audio files, no music, no voices).
   Knock, chime, pop, whoosh… The operator can mute with the speaker button or M. */
(function () {
  'use strict';
  let ctx = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem('box-mute') === '1'; } catch (e) { /* storage blocked: default on */ }
  function ac() {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function env(gn, t, a, peak, d) { gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(peak, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function osc(freq, t, dur, type, peak, slide) {
    const o = ctx.createOscillator(), gn = ctx.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    env(gn, t, 0.008, peak || 0.3, dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, type, f0, f1, peak, q) {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const bf = ctx.createBiquadFilter(); bf.type = type; bf.frequency.setValueAtTime(f0, t); if (f1) bf.frequency.exponentialRampToValueAtTime(f1, t + dur); bf.Q.value = q || 1;
    const gn = ctx.createGain(); env(gn, t, Math.min(0.06, dur * 0.3), peak, dur);
    s.connect(bf); bf.connect(gn); gn.connect(master); s.start(t); s.stop(t + dur + 0.1);
  }
  const SND = {
    knock(t) { osc(180, t, 0.16, 'sine', 0.6, 85); noise(t, 0.06, 'lowpass', 1100, null, 0.4); },
    chime(t) { [1046.5, 1318.5, 1568, 2093].forEach((fq, i) => osc(fq, t + i * 0.07, 1.1, 'sine', 0.11)); },
    sparkle(t) { for (let i = 0; i < 7; i++) osc(1800 + ((i * 523) % 1600), t + i * 0.055, 0.28, 'sine', 0.045); },
    pop(t) { osc(360, t, 0.12, 'sine', 0.26, 920); },
    rattle(t) { for (let i = 0; i < 8; i++) { osc(220 + (i % 2) * 40, t + i * 0.09, 0.06, 'triangle', 0.08 + i * 0.012); noise(t + i * 0.09, 0.04, 'bandpass', 1600, null, 0.05, 3); } },
    whoosh(t) { noise(t, 1.0, 'bandpass', 300, 2600, 0.2, 1.2); osc(520, t + 0.25, 0.8, 'sine', 0.05, 1040); },
    back(t) { noise(t, 0.8, 'bandpass', 2400, 300, 0.14, 1.2); },
    open(t) { noise(t, 1.3, 'bandpass', 200, 1400, 0.1, 0.8); [523.3, 659.3, 784, 1046.5].forEach((fq, i) => osc(fq, t + 0.35 + i * 0.12, 1.2, 'triangle', 0.08)); },
    grow(t) { [392, 494, 587.3, 740, 880, 1174.7].forEach((fq, i) => osc(fq, t + i * 0.3, 0.8, 'triangle', 0.07)); },
    burst(t) { SND.chime(t); noise(t, 0.7, 'highpass', 3000, 8000, 0.06); },
    vote(t) { osc(660, t, 0.18, 'triangle', 0.2, 990); osc(990, t + 0.08, 0.35, 'sine', 0.12); },
    wipe(t) { noise(t, 0.7, 'bandpass', 600, 1800, 0.07, 0.9); },
    plant(t) { osc(200, t, 0.18, 'sine', 0.3, 120); noise(t, 0.12, 'lowpass', 600, null, 0.12); },
    drip(t) { osc(1400, t, 0.1, 'sine', 0.1, 600); },
  };
  window.Sfx = {
    play(kind, delay) { if (muted || !SND[kind]) return; const c = ac(); if (!c) return; try { SND[kind](c.currentTime + 0.02 + (delay || 0)); } catch (e) { /* audio unavailable */ } },
    unlock() { if (!muted) ac(); },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('box-mute', muted ? '1' : '0'); } catch (e) { /* ignore */ } if (!muted) ac(); return muted; },
  };
})();

</script>
<script>
/* «صندوق العجائب» — screen 1 «الصندوق المضيء». Same method as «المدينة المقلوبة»: the screen acts out the
   scene's lines in book order on its own clock, then settles into a calm loop. All state = f(scene time t).
   Beats (seconds) — the narrators' guide lists them:

    if (i < 0 || i >= PLAN.length) return;
    if (D.isReduced() || still !== null) { st.target = null; activate(i); return; }
    st.target = i;
    const w = $('#wipe'); w.classList.remove('run'); void w.offsetWidth; w.classList.add('run'); SFX.play('wipe');

    st.pending = setTimeout(() => { const tgt = st.target; st.target = null; activate(tgt); }, 760);     // the moment the cloud fully covers the screen
  }
  $('#wipe').addEventListener('animationend', () => $('#wipe').classList.remove('run'));

  if (still !== null) document.body.classList.add('still');
  function loop() {
    const cur = scenes[st.index], t = still !== null ? still : sceneTime();
    cur.inst.update(t);
    if (still === null && cur.inst.cues) { for (const [ct, kind] of cur.inst.cues) if (ct > st.lastT && ct <= t) SFX.play(kind); st.lastT = t; }
    requestAnimationFrame(loop);
  }

  // fullscreen
  const app = $('#app');
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function syncFs() { const on = !!fsEl(); $('#fs').setAttribute('aria-label', on ? 'الخروج من ملء الشاشة' : 'ملء الشاشة'); $('#fs').classList.toggle('on', on); requestAnimationFrame(fit); }
  function hint() { const el = $('#toast'); el.classList.add('on'); clearTimeout(hint._t); hint._t = setTimeout(() => el.classList.remove('on'), 3800); }
  function toggleFs() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = app.requestFullscreen || app.webkitRequestFullscreen;
    if (!req) return hint();
    try { const p = req.call(app, { navigationUI: 'hide' }); if (p && p.catch) p.catch(hint); } catch (e) { hint(); }
    setTimeout(() => { if (!fsEl()) hint(); }, 1500);
  }
  document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);

  // sound on/off
  function syncMute() { $('#mute').classList.toggle('on', SFX.muted); $('#mute').setAttribute('aria-label', SFX.muted ? 'تشغيل الصوت' : 'كتم الصوت'); }

  function setProj(on, show) {

    if (show) { const p = $('#ptoast'); p.classList.toggle('lit', on); p.classList.add('on'); clearTimeout(setProj._t); setProj._t = setTimeout(() => p.classList.remove('on'), 1600); }
  }
  let projOn = params.get('proj') === '1'; try { projOn = projOn || localStorage.getItem('box-proj') === '1'; } catch (e) { /* ignore */ }
  setProj(projOn, false);

  $('#next').addEventListener('click', () => go(1));
  $('#prev').addEventListener('click', () => go(-1));
  $('#fs').addEventListener('click', toggleFs);
  $('#mute').addEventListener('click', toggleMute);
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key, onButton = e.target && e.target.tagName === 'BUTTON';
    let act = null;
    if (k === 'PageDown' || k === 'ArrowLeft' || k === 'ArrowDown') act = 'next';
    else if (k === 'PageUp' || k === 'ArrowRight' || k === 'ArrowUp') act = 'prev';
    else if ((k === ' ' || k === 'Enter') && !onButton) act = 'next';
    else if (k === 'f' || k === 'F' || k === 'ب') act = 'fs';
    else if (k === 'r' || k === 'R' || k === 'ق') act = 'replay';
    else if (k === 'm' || k === 'M' || k === 'ة') act = 'mute';
    else if (k === 'p' || k === 'P' || k === 'ح') act = 'proj';
    else if (/^[0-3٠-٣]$/.test(k)) act = 'vote';
    else if (k === '-' || k === '_') act = 'slower';
    else if (k === '+' || k === '=') act = 'faster';
    if (!act) return;
    e.preventDefault(); poke(); SFX.unlock();
    if (act === 'next') go(1); else if (act === 'prev') go(-1); else if (act === 'fs') toggleFs(); else if (act === 'mute') toggleMute();
    else if (act === 'proj') setProj(!app.classList.contains('proj'), true);
    else if (act === 'slower') setSpeed(speedI - 1); else if (act === 'faster') setSpeed(speedI + 1);
    else if (act === 'vote') { const cur = scenes[st.index]; if (cur.inst.vote) { const n = '0123'.indexOf(k) >= 0 ? '0123'.indexOf(k) : '٠١٢٣'.indexOf(k); cur.inst.vote(n - 1, sceneTime()); if (n > 0) SFX.play('vote'); } }
    else activate(st.index);
  });
  // the icon bar fades away while the story plays; any pointer/key brings it back
  let idleT = 0;
  function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!document.querySelector('.controls:hover, .controls :focus-visible')) document.body.classList.add('idle'); }, 2800); }
  ['pointermove', 'pointerdown', 'touchstart'].forEach((ev) => document.addEventListener(ev, poke, { passive: true }));
  document.addEventListener('pointerdown', () => SFX.unlock(), { passive: true });

  (function grain() {
    const c = document.createElement('canvas'); c.width = c.height = 220;
    const x = c.getContext('2d'), im = x.createImageData(220, 220);
    for (let i = 0; i < im.data.length; i += 4) { const v = 120 + Math.random() * 135; im.data[i] = v; im.data[i + 1] = v * 0.96; im.data[i + 2] = v * 0.9; im.data[i + 3] = 255; }
    x.putImageData(im, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
  })();

  window.addEventListener('resize', fit);
  syncMute(); fit(); activate(st.index, true); poke(); requestAnimationFrame(loop);
  window.__box = { get index() { return st.index; }, sceneTime, scenes, go, get speed() { return speed(); }, seek(t) { st.t0 = performance.now() - t * 1000 / speed(); st.lastT = t; scenes[st.index].inst.update(t); } };
})();
